<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>OptMusic 音乐工作台</title>
<style>
  html, body { margin: 0; height: 100%; background: #16181d; color: #8a919e;
    font: 14px "Segoe UI", "Microsoft YaHei", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .brand { color: #5b8def; font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  .spin { width: 34px; height: 34px; border: 3px solid #2f3440; border-top-color: #5b8def;
    border-radius: 50%; animation: s .9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  .err { display: none; max-width: 760px; white-space: pre-wrap; color: #e5484d; background: #1e2128;
    border: 1px solid #2f3440; border-radius: 6px; padding: 14px 16px; font: 12px Consolas, monospace;
    max-height: 50vh; overflow: auto; }
  body.failed .spin { display: none; }
  body.failed .err { display: block; }
</style>
</head>
<body>
  <div class="brand">OptMusic</div>
  <div class="spin"></div>
  <div id="msg">正在启动音频分析引擎…</div>
  <div id="err" class="err"></div>
<script>
  window.setProgress = (s) => {
    document.getElementById("msg").textContent =
      `正在启动音频分析引擎… ${s}s` + (s > 15 ? "（首次启动需要较长时间）" : "");
  };
  window.showError = (m) => {
    document.body.classList.add("failed");
    document.getElementById("msg").textContent = "启动失败";
    document.getElementById("err").textContent = m;
  };
</script>
</body>
</html>
